# Sideload / first-test APK. Does NOT use KEYSTORE_* secrets.
# Release variants are signed with the debug keystore via -PciUseDebugSigning=true.
name: Sideload debug-signed APK

on:
  push:
    branches:
      - cursor/sideload-apk-011-4894
  workflow_dispatch:
    inputs:
      version:
        description: versionName without v prefix
        required: false
        default: "0.1.1"
      version_code:
        description: Android versionCode (must be greater than previous sideload)
        required: false
        default: "1001"

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GRADLE_OPTS: -Xmx4096m -Dfile.encoding=UTF-8
      SIDELOAD_VERSION: ${{ github.event.inputs.version || '0.1.1' }}
      SIDELOAD_VERSION_CODE: ${{ github.event.inputs.version_code || '1001' }}

    steps:
      - name: Checkout triggering ref (PR #7 branch code, not main)
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Assemble originalArmRelease (debug signing)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleOriginalArmRelease \
            -PciUseDebugSigning=true \
            -PreleaseVersion="${SIDELOAD_VERSION}" \
            -PversionCode="${SIDELOAD_VERSION_CODE}" \
            --stacktrace --no-daemon

      - name: Package APK
        run: |
          set -euo pipefail
          mkdir -p artifacts
          echo "=== 构建输出目录（全部 APK）==="
          find app/build/outputs/apk -name "*.apk" -type f | sort || true
          dir="app/build/outputs/apk/originalArm/release"
          apk=$(find "$dir" -type f -name "*.apk" ! -name "*-unsigned.apk" ! -name "*unaligned*" | head -n1)
          if [[ -z "${apk}" || ! -f "${apk}" ]]; then
            echo "::error::未找到 originalArmRelease APK"
            exit 1
          fi
          dest="artifacts/miaotv-${SIDELOAD_VERSION}-arm-debugsigned.apk"
          cp "$apk" "$dest"
          ls -lh "$dest"
          unzip -l "$dest" | grep -E "lib/.+\.so$" | head -n 40 || true

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: miaotv-${{ env.SIDELOAD_VERSION }}-arm-debugsigned
          path: artifacts/miaotv-${{ env.SIDELOAD_VERSION }}-arm-debugsigned.apk
          if-no-files-found: error

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.SIDELOAD_VERSION }}
          target_commitish: ${{ github.sha }}
          name: miaoTv ${{ env.SIDELOAD_VERSION }}
          prerelease: true
          fail_on_unmatched_files: true
          files: artifacts/miaotv-${{ env.SIDELOAD_VERSION }}-arm-debugsigned.apk
          body: |
            这是基于 PR #7（`cursor/prerelease-update-cctv-fallback-c73f`）的侧载测试包（`originalArmRelease`，包名 `com.feverdestiny.miaotv`，versionName `0.1.1` / versionCode `1001`）。

            相对 `v0.1.0` 本包包含：

            - 默认订阅源：jsDelivr → gh-proxy → GitHub raw（[`sources/cn.m3u`](https://github.com/feverdestiny/miaoTv/blob/main/sources/cn.m3u)）
            - 应用内更新检查：`/releases` 列表 API（可看到 prerelease）+ gh-proxy 回退
            - `cctv.m3u` 同样的 jsDelivr / gh-proxy / GitHub raw 回退

            - **调试签名（debug-signed）**：后续正式签名包无法覆盖安装，请先卸载本测试包再装正式版
            - 安装方式：Android TV / 盒子通过 U 盘或 ADB 侧载
            - 不覆盖已有的 `v0.1.0` 发布

            构建：`./gradlew :app:assembleOriginalArmRelease -PciUseDebugSigning=true -PreleaseVersion=0.1.1 -PversionCode=1001`
